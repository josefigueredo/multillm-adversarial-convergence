<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" font-family="Geist, system-ui, sans-serif" font-size="13" fill="none">
  <!-- PALETTE: panel #0d1117 · ink · soft · mute · amber · cyan · green · warn
       LAYOUT — Fork/join. Task fans out to N backends in parallel,
                results converge into a Judge that merges or votes,
                producing the best answer. Forks render symmetrically. -->
  <defs>
    <marker id="ah-mute"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8590"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5a524"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- T · Task -->
  <g transform="translate(40 190)" filter="url(#node-shadow)">
    <rect width="200" height="100" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">TASK</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Single dimension</text>
    <text x="14" y="74" font-size="11" fill="#b1bac4">same prompt to every backend</text>
  </g>

  <!-- 3 Backends in parallel column -->
  <g transform="translate(360 60)" filter="url(#node-shadow)">
    <rect width="240" height="80" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">BACKEND · A</text>
    <text x="14" y="46" font-size="16" font-weight="600" fill="#e6edf3">claude-cli</text>
    <text x="14" y="66" font-size="11" fill="#b1bac4">family · Claude</text>
  </g>
  <g transform="translate(360 200)" filter="url(#node-shadow)">
    <rect width="240" height="80" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">BACKEND · B</text>
    <text x="14" y="46" font-size="16" font-weight="600" fill="#e6edf3">gemini-cli</text>
    <text x="14" y="66" font-size="11" fill="#b1bac4">family · Gemini</text>
  </g>
  <g transform="translate(360 340)" filter="url(#node-shadow)">
    <rect width="240" height="80" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">BACKEND · C</text>
    <text x="14" y="46" font-size="16" font-weight="600" fill="#e6edf3">copilot-cli</text>
    <text x="14" y="66" font-size="11" fill="#b1bac4">family · GPT*</text>
  </g>

  <!-- M · Judge (merge/vote) -->
  <g transform="translate(720 190)" filter="url(#node-shadow)">
    <polygon points="100,0 200,50 100,100 0,50" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="100" y="38" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" text-anchor="middle" letter-spacing="1.6">JUDGE · MERGE</text>
    <text x="100" y="58" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">vote · select</text>
    <text x="100" y="78" font-size="11" fill="#b1bac4" text-anchor="middle">consensus or pick best</text>
  </g>

  <!-- O · Best answer -->
  <g transform="translate(1000 190)" filter="url(#node-shadow)">
    <rect width="240" height="100" rx="50" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
    <text x="120" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" text-anchor="middle" letter-spacing="1.6">OUTCOME</text>
    <text x="120" y="50" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Best answer</text>
    <text x="120" y="74" font-size="11" fill="#b1bac4" text-anchor="middle">low-variance ensemble</text>
  </g>

  <!-- ─── FORK ARROWS (T → A,B,C) ─── -->
  <path stroke="#7d8590" stroke-width="1.4" fill="none" d="M 240 220 C 300 220, 300 100, 360 100" marker-end="url(#ah-mute)"/>
  <path stroke="#7d8590" stroke-width="1.4" fill="none" d="M 240 240 L 360 240" marker-end="url(#ah-mute)"/>
  <path stroke="#7d8590" stroke-width="1.4" fill="none" d="M 240 260 C 300 260, 300 380, 360 380" marker-end="url(#ah-mute)"/>

  <!-- ─── JOIN ARROWS (A,B,C → M) ─── -->
  <path stroke="#22d3ee" stroke-width="1.4" fill="none" d="M 600 100 C 660 100, 660 220, 720 220" marker-end="url(#ah-amber)"/>
  <path stroke="#22d3ee" stroke-width="1.4" fill="none" d="M 600 240 L 720 240" marker-end="url(#ah-amber)"/>
  <path stroke="#22d3ee" stroke-width="1.4" fill="none" d="M 600 380 C 660 380, 660 260, 720 260" marker-end="url(#ah-amber)"/>

  <!-- ─── M → O ─── -->
  <path stroke="#7ee787" stroke-width="1.5" fill="none" d="M 920 240 L 1000 240" marker-end="url(#ah-green)"/>

  <!-- annotations -->
  <g font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" text-anchor="middle">
    <g transform="translate(300 156)">
      <rect x="-32" y="-9" width="64" height="16" rx="3" fill="#0d1117" stroke="#7d8590" stroke-width="0.75"/>
      <text y="3" fill="#b1bac4">FAN-OUT</text>
    </g>
    <g transform="translate(660 156)">
      <rect x="-26" y="-9" width="52" height="16" rx="3" fill="#0d1117" stroke="#22d3ee" stroke-width="0.75"/>
      <text y="3" fill="#22d3ee">JOIN</text>
    </g>
  </g>

  <!-- ─── INVARIANT FOOTER ─── -->
  <g transform="translate(40 430)" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#7d8590" stroke-opacity="0.18"/>
    <text x="0" y="20">▸ INVARIANT — bounded parallelism (ThreadPoolExecutor) so a slow backend can't tie up the rate limit</text>
  </g>
</svg>
