<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" font-family="Geist, system-ui, sans-serif" font-size="13" fill="none">
  <!-- PALETTE: panel #0d1117 · ink · soft · mute · amber · cyan · green · warn
       LAYOUT — Dimension request flows into a Router (decision diamond), which dispatches to one of three specialists by persona. Specialists' best-fit answer flows out to the right. -->
  <defs>
    <marker id="ah-mute"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8590"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5a524"/></marker>
    <marker id="ah-cyan"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#22d3ee"/></marker>
    <marker id="ah-warn"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff7b72"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- T · Dimension request -->
  <g transform="translate(40 200)" filter="url(#node-shadow)">
    <rect width="200" height="100" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">REQUEST</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Dimension</text>
    <text x="14" y="74" font-size="11" fill="#b1bac4">e.g. "IaC toolchain"</text>
  </g>

  <!-- R · Router (diamond, amber) -->
  <g transform="translate(290 200)" filter="url(#node-shadow)">
    <polygon points="100,0 200,50 100,100 0,50" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="100" y="38" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" text-anchor="middle" letter-spacing="1.6">ROUTER</text>
    <text x="100" y="58" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">specialist</text>
    <text x="100" y="78" font-size="11" fill="#b1bac4" text-anchor="middle">strategy = persona</text>
  </g>

  <!-- 3 specialists (right column) -->
  <g transform="translate(580 60)" filter="url(#node-shadow)">
    <rect width="280" height="92" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">PERSONA · BREADTH</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Coverage specialist</text>
    <text x="14" y="72" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">copilot-cli</text>
  </g>
  <g transform="translate(580 200)" filter="url(#node-shadow)">
    <rect width="280" height="92" rx="6" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" letter-spacing="1.6">PERSONA · PRECISION</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Critic specialist</text>
    <text x="14" y="72" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">codex-cli</text>
  </g>
  <g transform="translate(580 340)" filter="url(#node-shadow)">
    <rect width="280" height="92" rx="6" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" letter-spacing="1.6">PERSONA · STRUCTURE</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Synthesis specialist</text>
    <text x="14" y="72" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">claude-cli</text>
  </g>

  <!-- OUT · Best-fit answer -->
  <g transform="translate(1000 200)" filter="url(#node-shadow)">
    <rect width="240" height="100" rx="50" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
    <text x="120" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" text-anchor="middle" letter-spacing="1.6">OUTCOME</text>
    <text x="120" y="50" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Best-fit answer</text>
    <text x="120" y="74" font-size="11" fill="#b1bac4" text-anchor="middle">routed to right prior</text>
  </g>

  <!-- ─── ARROWS ─── -->
  <!-- T → R -->
  <path stroke="#7d8590" stroke-width="1.4" fill="none" d="M 240 250 L 290 250" marker-end="url(#ah-mute)"/>

  <!-- R → A,B,C (amber, fanning) -->
  <path stroke="#22d3ee" stroke-width="1.4" fill="none" d="M 490 250 C 540 220, 540 106, 580 106" marker-end="url(#ah-cyan)"/>
  <path stroke="#ff7b72" stroke-width="1.4" fill="none" d="M 490 250 L 580 246" marker-end="url(#ah-warn)"/>
  <path stroke="#7ee787" stroke-width="1.4" fill="none" d="M 490 250 C 540 280, 540 386, 580 386" marker-end="url(#ah-green)"/>

  <!-- A,B,C → OUT (gray, converging) -->
  <path stroke="#22d3ee" stroke-width="1.4" fill="none" d="M 860 106 C 940 106, 940 220, 1010 220" marker-end="url(#ah-cyan)"/>
  <path stroke="#ff7b72" stroke-width="1.4" fill="none" d="M 860 246 L 1000 250" marker-end="url(#ah-warn)"/>
  <path stroke="#7ee787" stroke-width="1.4" fill="none" d="M 860 386 C 940 386, 940 280, 1010 280" marker-end="url(#ah-green)"/>

  <!-- ─── INVARIANT FOOTER ─── -->
  <g transform="translate(40 450)" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#7d8590" stroke-opacity="0.18"/>
    <text x="0" y="20">▸ INVARIANT — if no specialist matches, fall through to `primary` (fail-safe, not fail-stop)</text>
  </g>
</svg>
