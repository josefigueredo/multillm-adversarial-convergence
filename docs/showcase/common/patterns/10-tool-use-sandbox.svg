<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" font-family="Geist, system-ui, sans-serif" font-size="13" fill="none">
  <!-- PALETTE: panel #0d1117 · ink · soft · mute · amber · cyan · green · warn
       LAYOUT — Agent issues a tool call, capability registry decides allow/deny.
                Allow path: sandbox → execute → audit. Deny path: → audit.
                Both branches converge on the audit log. -->
  <defs>
    <marker id="ah-mute"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8590"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5a524"/></marker>
    <marker id="ah-cyan"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#22d3ee"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker>
    <marker id="ah-warn"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff7b72"/></marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- AG · Agent (gray) -->
  <g transform="translate(40 200)" filter="url(#node-shadow)">
    <rect width="180" height="100" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">AGENT</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Producer</text>
    <text x="14" y="74" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">claude-cli</text>
  </g>

  <!-- REQ · Tool call (gray) -->
  <g transform="translate(260 200)" filter="url(#node-shadow)">
    <rect width="220" height="100" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">TOOL CALL</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">request</text>
    <text x="14" y="74" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">WebFetch · Bash · Write</text>
  </g>

  <!-- REG · Capability registry (diamond, amber) -->
  <g transform="translate(540 180)" filter="url(#node-shadow)">
    <polygon points="120,0 240,70 120,140 0,70" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="120" y="46" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" text-anchor="middle" letter-spacing="1.6">CAPABILITY REGISTRY</text>
    <text x="120" y="70" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">allowlist?</text>
    <text x="120" y="90" font-size="11" fill="#b1bac4" text-anchor="middle">least-privilege gate</text>
  </g>

  <!-- TOP BRANCH (allowed): SBX → OK -->
  <g transform="translate(820 60)" filter="url(#node-shadow)">
    <rect width="220" height="92" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">SANDBOX</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Restricted exec</text>
    <text x="14" y="72" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">.workspace/ · web_only</text>
  </g>

  <g transform="translate(1080 60)" filter="url(#node-shadow)">
    <rect width="180" height="92" rx="46" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
    <text x="90" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" text-anchor="middle" letter-spacing="1.6">✓ EXECUTE</text>
    <text x="90" y="56" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">OK</text>
  </g>

  <!-- BOTTOM BRANCH (denied): DENY -->
  <g transform="translate(820 360)" filter="url(#node-shadow)">
    <rect width="220" height="92" rx="6" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" letter-spacing="1.6">✗ DENIED</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">tool_denied</text>
    <text x="14" y="72" font-size="11" fill="#b1bac4">policy violation</text>
  </g>

  <!-- AUD · Audit trail (right center) -->
  <g transform="translate(1080 200)" filter="url(#node-shadow)">
    <rect width="180" height="120" rx="6" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" letter-spacing="1.6">EVIDENCE</text>
    <text x="14" y="48" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#e6edf3">audit_trail</text>
    <text x="14" y="64" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#e6edf3">.jsonl</text>
    <text x="14" y="92" font-size="11" fill="#b1bac4">append-only · forensic</text>
    <text x="14" y="108" font-size="11" fill="#b1bac4">trace</text>
  </g>

  <!-- ─── ARROWS ─── -->
  <!-- AG → REQ -->
  <path stroke="#7d8590" stroke-width="1.4" fill="none" d="M 220 250 L 260 250" marker-end="url(#ah-mute)"/>
  <!-- REQ → REG -->
  <path stroke="#7d8590" stroke-width="1.4" fill="none" d="M 480 250 L 540 250" marker-end="url(#ah-mute)"/>

  <!-- REG → SBX (allowed, cyan) -->
  <path stroke="#22d3ee" stroke-width="1.5" fill="none" d="M 720 220 C 770 220, 770 106, 820 106" marker-end="url(#ah-cyan)"/>
  <!-- SBX → OK (cyan) -->
  <path stroke="#22d3ee" stroke-width="1.4" fill="none" d="M 1040 106 L 1080 106" marker-end="url(#ah-green)"/>
  <!-- OK → AUD (gray dotted, "event") -->
  <path stroke="#7d8590" stroke-width="1.1" stroke-dasharray="3 3" fill="none" d="M 1170 152 L 1170 200" marker-end="url(#ah-mute)"/>

  <!-- REG → DENY (denied, warn) -->
  <path stroke="#ff7b72" stroke-width="1.5" fill="none" d="M 720 280 C 770 280, 770 406, 820 406" marker-end="url(#ah-warn)"/>
  <!-- DENY → AUD (gray dotted, "event") -->
  <path stroke="#7d8590" stroke-width="1.1" stroke-dasharray="3 3" fill="none" d="M 1040 406 C 1100 406, 1170 360, 1170 320" marker-end="url(#ah-mute)"/>

  <!-- decision pills -->
  <g font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" text-anchor="middle">
    <g transform="translate(770 162)">
      <rect x="-36" y="-9" width="72" height="16" rx="3" fill="#0d1117" stroke="#22d3ee" stroke-width="0.75"/>
      <text y="3" fill="#22d3ee">ALLOWED</text>
    </g>
    <g transform="translate(770 340)">
      <rect x="-32" y="-9" width="64" height="16" rx="3" fill="#0d1117" stroke="#ff7b72" stroke-width="0.75"/>
      <text y="3" fill="#ff7b72">DENIED</text>
    </g>
    <g transform="translate(1170 174)">
      <rect x="-26" y="-9" width="52" height="16" rx="3" fill="#0d1117" stroke="#7d8590" stroke-width="0.75"/>
      <text y="3" fill="#b1bac4">EVENT</text>
    </g>
  </g>

  <!-- ─── INVARIANT FOOTER ─── -->
  <g transform="translate(40 490)" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#7d8590" stroke-opacity="0.18"/>
    <text x="0" y="20">▸ INVARIANT — capability registry is the agentic equivalent of an IAM policy; both allow AND deny are auditable</text>
  </g>
</svg>
