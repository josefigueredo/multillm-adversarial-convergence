<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" font-family="Geist, system-ui, sans-serif" font-size="13" fill="none">
  <!-- PALETTE: panel #0d1117 · ink #e6edf3 · soft #b1bac4 · mute #7d8590 · amber #f5a524 · cyan #22d3ee · green #7ee787 · warn #ff7b72
       LAYOUT — top row: G → E → D{decision} → K → OUT  (linear with diamond)
                bottom: R (the rejected branch hangs below D)
                two loop-backs (K→G, R→G) arc over the top and under the bottom respectively. -->

  <defs>
    <marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8590"/></marker>
    <marker id="ah-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#22d3ee"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker>
    <marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff7b72"/></marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ─── TOP ROW: G  E  D⟨⟩  K  OUT ─── -->
  <!-- G · Generate (40-220) -->
  <g transform="translate(40 100)" filter="url(#node-shadow)">
    <rect width="180" height="92" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">PRODUCER</text>
    <text x="14" y="50" font-size="17" font-weight="600" fill="#e6edf3">Generate</text>
    <text x="14" y="74" font-size="11" fill="#b1bac4">proposal · code · text</text>
  </g>

  <!-- E · Evaluate (260-440) -->
  <g transform="translate(260 100)" filter="url(#node-shadow)">
    <rect width="180" height="92" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">EVALUATOR</text>
    <text x="14" y="50" font-size="17" font-weight="600" fill="#e6edf3">Evaluate</text>
    <text x="14" y="74" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">heuristic + judge</text>
  </g>

  <!-- D · Score ≥ τ? (diamond, amber)  cx=580→780 -->
  <g transform="translate(480 98)" filter="url(#node-shadow)">
    <polygon points="100,0 200,48 100,96 0,48" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="100" y="34" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" text-anchor="middle" letter-spacing="1.6">DECISION</text>
    <text x="100" y="56" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Score ≥ τ?</text>
    <text x="100" y="74" font-size="11" fill="#b1bac4" text-anchor="middle">composite threshold</text>
  </g>

  <!-- K · Keep (720-900) -->
  <g transform="translate(720 100)" filter="url(#node-shadow)">
    <rect width="200" height="92" rx="6" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" letter-spacing="1.6">✓ KEEP</text>
    <text x="14" y="46" font-size="16" font-weight="600" fill="#e6edf3">Grow corpus</text>
    <text x="14" y="68" font-size="11" fill="#b1bac4">claim accepted into KB</text>
  </g>

  <!-- OUT · Converged (cyan, far right, beside K) -->
  <g transform="translate(1000 100)" filter="url(#node-shadow)">
    <rect width="220" height="92" rx="46" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="110" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" text-anchor="middle" letter-spacing="1.6">OUTCOME</text>
    <text x="110" y="50" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Converged</text>
    <text x="110" y="72" font-size="11" fill="#b1bac4" text-anchor="middle">score plateau reached</text>
  </g>

  <!-- ─── BOTTOM: R · Reject (under D) ─── -->
  <g transform="translate(480 280)" filter="url(#node-shadow)">
    <rect width="200" height="86" rx="6" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" letter-spacing="1.6">✗ DISCARD</text>
    <text x="14" y="46" font-size="16" font-weight="600" fill="#e6edf3">Reject</text>
    <text x="14" y="66" font-size="11" fill="#b1bac4">retry same dimension</text>
  </g>

  <!-- ─── FORWARD ARROWS ─── -->
  <g stroke="#7d8590" stroke-width="1.2" fill="none">
    <path d="M 220 146 L 260 146" marker-end="url(#ah-mute)"/>
    <path d="M 440 146 L 480 146" marker-end="url(#ah-mute)"/>
  </g>

  <!-- D → K (yes, green). Pill nudged slightly left to clear K's left edge. -->
  <path stroke="#7ee787" stroke-width="1.5" fill="none" d="M 680 146 L 720 146" marker-end="url(#ah-green)"/>
  <g transform="translate(694 132)">
    <rect x="-22" y="-9" width="44" height="16" rx="3" fill="#0d1117" stroke="#7ee787" stroke-width="0.75"/>
    <text x="0" y="3" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" text-anchor="middle" letter-spacing="1.4">YES</text>
  </g>

  <!-- K → OUT (plateau, cyan dotted, horizontal) -->
  <path stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 3" fill="none" d="M 920 146 L 1000 146" marker-end="url(#ah-cyan)"/>
  <g transform="translate(960 132)">
    <rect x="-32" y="-9" width="64" height="16" rx="3" fill="#0d1117" stroke="#22d3ee" stroke-width="0.75"/>
    <text x="0" y="3" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" text-anchor="middle" letter-spacing="1.4">PLATEAU</text>
  </g>

  <!-- D → R (no, warn, vertical down) -->
  <path stroke="#ff7b72" stroke-width="1.5" fill="none" d="M 580 194 L 580 280" marker-end="url(#ah-warn)"/>
  <g transform="translate(600 235)">
    <rect x="-18" y="-9" width="36" height="16" rx="3" fill="#0d1117" stroke="#ff7b72" stroke-width="0.75"/>
    <text x="0" y="3" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" text-anchor="middle" letter-spacing="1.4">NO</text>
  </g>

  <!-- R → G (loop back, dashed mute, bottom arc) -->
  <path stroke="#7d8590" stroke-width="1.2" stroke-dasharray="4 4" fill="none"
        d="M 480 323 C 280 323, 130 323, 130 192" marker-end="url(#ah-mute)"/>
  <g transform="translate(330 332)">
    <rect x="-75" y="-9" width="148" height="16" rx="3" fill="#0d1117" stroke="#7d8590" stroke-width="0.75"/>
    <text x="0" y="3" font-family="JetBrains Mono, monospace" font-size="10" fill="#b1bac4" text-anchor="middle" letter-spacing="1.4">RETRY · REGENERATE</text>
  </g>

  <!-- K → G (loop back, dashed mute, top arc) -->
  <path stroke="#7d8590" stroke-width="1.2" stroke-dasharray="4 4" fill="none"
        d="M 820 100 C 820 50, 130 50, 130 100" marker-end="url(#ah-mute)"/>
  <g transform="translate(475 38)">
    <rect x="-56" y="-9" width="112" height="16" rx="3" fill="#0d1117" stroke="#7d8590" stroke-width="0.75"/>
    <text x="0" y="3" font-family="JetBrains Mono, monospace" font-size="10" fill="#b1bac4" text-anchor="middle" letter-spacing="1.4">NEXT DIMENSION</text>
  </g>

  <!-- ─── INVARIANT FOOTER ─── -->
  <g transform="translate(40 410)" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#7d8590" stroke-opacity="0.18"/>
    <text x="0" y="20">▸ INVARIANT — evaluator must not be the producer; otherwise self-grading bias defeats the loop</text>
  </g>
</svg>
