<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" font-family="Geist, system-ui, sans-serif" font-size="13" fill="none">
  <!-- PALETTE: panel #0d1117 · ink · soft · mute · amber · cyan · green · warn
       LAYOUT — two columns: left = ROLES (config-time abstractions),
                              right = BACKENDS (registry).
                Lines bind a role to its backend. Roles can fan-out to multiple backends. -->
  <defs>
    <marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8590"/></marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- COLUMN HEADERS -->
  <text x="40" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#f5a524" letter-spacing="2">ROLES · CONFIG</text>
  <text x="780" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#22d3ee" letter-spacing="2">BACKENDS · REGISTRY</text>

  <!-- ROLES (left column) -->
  <g filter="url(#node-shadow)">
    <g transform="translate(40 90)">
      <rect width="240" height="74" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">ROLE</text>
      <text x="14" y="46" font-size="17" font-weight="600" fill="#e6edf3">primary</text>
      <text x="14" y="64" font-size="11" fill="#b1bac4">main reasoner</text>
    </g>
    <g transform="translate(40 200)">
      <rect width="240" height="74" rx="6" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" letter-spacing="1.6">ROLE</text>
      <text x="14" y="46" font-size="17" font-weight="600" fill="#e6edf3">judge</text>
      <text x="14" y="64" font-size="11" fill="#b1bac4">non-producer scorer</text>
    </g>
    <g transform="translate(40 310)">
      <rect width="240" height="74" rx="6" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" letter-spacing="1.6">ROLE</text>
      <text x="14" y="46" font-size="17" font-weight="600" fill="#e6edf3">utility</text>
      <text x="14" y="64" font-size="11" fill="#b1bac4">tool exec · sandboxed</text>
    </g>
    <g transform="translate(40 420)">
      <rect width="240" height="74" rx="6" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" letter-spacing="1.6">ROLE · ARRAY</text>
      <text x="14" y="46" font-size="17" font-weight="600" fill="#e6edf3">research[]</text>
      <text x="14" y="64" font-size="11" fill="#b1bac4">may bind multiple</text>
    </g>
  </g>

  <!-- BACKENDS (right column) -->
  <g filter="url(#node-shadow)">
    <g transform="translate(780 80)">
      <rect width="220" height="68" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">BACKEND</text>
      <text x="14" y="46" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#e6edf3">claude-cli</text>
      <text x="14" y="62" font-size="11" fill="#7d8590">family · Claude</text>
    </g>
    <g transform="translate(780 178)">
      <rect width="220" height="68" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">BACKEND</text>
      <text x="14" y="46" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#e6edf3">codex-cli</text>
      <text x="14" y="62" font-size="11" fill="#7d8590">family · GPT</text>
    </g>
    <g transform="translate(780 276)">
      <rect width="220" height="68" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">BACKEND</text>
      <text x="14" y="46" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#e6edf3">gemini-cli</text>
      <text x="14" y="62" font-size="11" fill="#7d8590">family · Gemini</text>
    </g>
    <g transform="translate(780 374)">
      <rect width="220" height="68" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">BACKEND</text>
      <text x="14" y="46" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#e6edf3">copilot-cli</text>
      <text x="14" y="62" font-size="11" fill="#7d8590">family · GPT*</text>
    </g>
  </g>

  <!-- BINDING LINES (role → backend) -->
  <g fill="none" stroke-width="1.4">
    <!-- primary → claude-cli -->
    <path stroke="#7d8590" d="M 280 127 C 530 127, 530 114, 780 114" marker-end="url(#ah-mute)"/>
    <!-- judge → codex-cli -->
    <path stroke="#f5a524" d="M 280 237 C 530 237, 530 212, 780 212" marker-end="url(#ah-mute)"/>
    <!-- utility → codex-cli (same as judge!) -->
    <path stroke="#ff7b72" d="M 280 347 C 530 347, 530 212, 780 212" marker-end="url(#ah-mute)"/>
    <!-- research[] → copilot-cli -->
    <path stroke="#7ee787" d="M 280 457 C 530 457, 530 408, 780 408" marker-end="url(#ah-mute)"/>
    <!-- research[] → gemini-cli (fan-out) -->
    <path stroke="#7ee787" d="M 280 467 C 530 467, 530 310, 780 310" marker-end="url(#ah-mute)"/>
  </g>

  <!-- annotation: shared backend pill -->
  <g transform="translate(540 188)" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.2" text-anchor="middle">
    <rect x="-58" y="-9" width="116" height="16" rx="3" fill="#0d1117" stroke="#7d8590" stroke-width="0.75"/>
    <text y="3" fill="#b1bac4">2 ROLES · 1 BACKEND</text>
  </g>
  <g transform="translate(540 388)" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.2" text-anchor="middle">
    <rect x="-58" y="-9" width="136" height="16" rx="3" fill="#0d1117" stroke="#7ee787" stroke-width="0.75"/>
    <text y="3" fill="#7ee787">FAN-OUT · 1 ROLE → N</text>
  </g>

  <!-- ─── INVARIANT FOOTER ─── -->
  <g transform="translate(40 510)" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
    <line x1="0" y1="0" x2="1200" y2="-10" stroke="#7d8590" stroke-opacity="0.18"/>
    <text x="0" y="20">▸ INVARIANT — orchestrator code names roles, not backends; swapping a backend is a config edit, never a code change</text>
  </g>
</svg>
