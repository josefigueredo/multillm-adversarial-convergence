  <script>
    (() => {
      const slides = JSON.parse(document.getElementById('notes-data').textContent);
      const total = slides.length;
      const els = {
        idx: document.getElementById('slide-index'),
        title: document.getElementById('slide-title'),
        timing: document.getElementById('slide-timing'),
        notes: document.getElementById('slide-notes'),
        cur: document.getElementById('cur'),
        total: document.getElementById('total'),
        prev: document.getElementById('btn-prev'),
        next: document.getElementById('btn-next'),
        jump: document.getElementById('jump'),
        deck: document.getElementById('open-deck'),
      };
      els.total.textContent = total;
      let current = 1;

      // Build jump strip
      for (let i = 1; i <= total; i++) {
        const b = document.createElement('button');
        b.textContent = i;
        b.dataset.slide = i;
        b.addEventListener('click', () => go(i));
        els.jump.appendChild(b);
      }

      function pad(n) { return String(n).padStart(2, '0'); }

      function render(n) {
        const s = slides[n - 1];
        els.idx.textContent = `SLIDE · ${pad(n)} / ${pad(total)}`;
        els.title.textContent = s.title || '—';
        els.timing.textContent = s.timing || '';
        els.timing.style.display = s.timing ? 'block' : 'none';
        if (s.notes && s.notes.trim().length) {
          els.notes.textContent = s.notes;
          els.notes.classList.remove('empty');
        } else {
          els.notes.textContent = '(no speaker notes for this slide)';
          els.notes.classList.add('empty');
        }
        els.cur.textContent = n;
        document.querySelectorAll('.jump button').forEach(b => {
          b.classList.toggle('active', parseInt(b.dataset.slide) === n);
        });
        els.prev.disabled = n <= 1;
        els.next.disabled = n >= total;
        // scroll jump strip so the active chip is visible
        const active = els.jump.querySelector('.active');
        if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      function go(n, broadcast = true) {
        n = Math.max(1, Math.min(total, n));
        if (n === current) return;
        current = n;
        render(n);
        history.replaceState(null, '', '#' + n);
        if (broadcast) {
          try { localStorage.setItem('deckCurrentSlide', String(n)); } catch (e) {}
        }
      }
      function next() { go(current + 1); }
      function prev() { go(current - 1); }

      els.prev.addEventListener('click', prev);
      els.next.addEventListener('click', next);

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        switch (e.key) {
          case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); next(); break;
          case 'ArrowLeft':  case 'PageUp':            e.preventDefault(); prev(); break;
          case 'Home':                                  e.preventDefault(); go(1); break;
          case 'End':                                   e.preventDefault(); go(total); break;
          case 'o': case 'O':
            window.open('../deck/clean.html', 'deck-window');
            break;
        }
      });

      // ── Cross-tab sync (other window writes deckCurrentSlide) ──
      window.addEventListener('storage', (e) => {
        if (e.key !== 'deckCurrentSlide' || e.newValue == null) return;
        const n = parseInt(e.newValue, 10);
        if (!isNaN(n) && n !== current) go(n, false);
      });

      // initial slide from hash, or last value in storage
      function startSlide() {
        const m = location.hash.match(/^#(\d+)$/);
        if (m) return parseInt(m[1], 10);
        const stored = localStorage.getItem('deckCurrentSlide');
        if (stored) return parseInt(stored, 10);
        return 1;
      }
      go(startSlide(), false);
      window.addEventListener('hashchange', () => {
        const m = location.hash.match(/^#(\d+)$/);
        if (m) go(parseInt(m[1], 10));
      });
    })();
  </script>
