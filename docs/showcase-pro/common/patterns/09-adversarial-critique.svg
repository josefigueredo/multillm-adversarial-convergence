<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" font-family="Geist, system-ui, sans-serif" font-size="13" fill="none">
  <!-- PALETTE: panel #0d1117 · ink #e6edf3 · soft #b1bac4 · mute #7d8590 · amber #f5a524 · cyan #22d3ee · green #7ee787 · warn #ff7b72 -->

  <defs>
    <marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8590"/></marker>
    <marker id="ah-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#22d3ee"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker>
    <marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff7b72"/></marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ─── ROW: Researcher → Critic → Arbitrator → Verdict ───
       gaps sized to fit the widest label in each gap -->

  <!-- R · Researcher  (x=20→240) -->
  <g transform="translate(20 80)" filter="url(#node-shadow)">
    <rect width="220" height="110" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">ROLE · RESEARCHER</text>
    <text x="14" y="54" font-size="18" font-weight="600" fill="#e6edf3">Producer</text>
    <text x="14" y="78" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">copilot-cli</text>
    <text x="14" y="96" font-size="11" fill="#7d8590">family · GPT</text>
  </g>

  <!-- C · Critic  (x=320→540) — gap 80 for CLAIM (60w) -->
  <g transform="translate(320 80)" filter="url(#node-shadow)">
    <rect width="220" height="110" rx="6" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" letter-spacing="1.6">ROLE · CRITIC</text>
    <text x="14" y="54" font-size="18" font-weight="600" fill="#e6edf3">Adversary</text>
    <text x="14" y="78" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">codex-cli</text>
    <text x="14" y="96" font-size="11" fill="#7d8590">family · GPT* (different RLHF)</text>
  </g>

  <!-- A · Arbitrator  (x=720→940) — gap 180 for FLAGGED · WEAK CITE (116w) -->
  <g transform="translate(720 80)" filter="url(#node-shadow)">
    <rect width="220" height="110" rx="6" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" letter-spacing="1.6">ROLE · ARBITRATOR</text>
    <text x="14" y="54" font-size="18" font-weight="600" fill="#e6edf3">Judge</text>
    <text x="14" y="78" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">claude-cli</text>
    <text x="14" y="96" font-size="11" fill="#7d8590">family · Claude</text>
  </g>

  <!-- OK · Verdict  (x=1020→1260) — gap 80 for RULES (60w) -->
  <g transform="translate(1020 80)" filter="url(#node-shadow)">
    <rect width="240" height="110" rx="6" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" letter-spacing="1.6">VERDICT</text>
    <text x="14" y="54" font-size="18" font-weight="600" fill="#e6edf3">Keep · Revise · Reject</text>
    <text x="14" y="80" font-size="11" fill="#b1bac4">decision recorded in</text>
    <text x="14" y="96" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">audit_trail.jsonl</text>
  </g>

  <!-- ─── FORWARD ARROWS ─── -->
  <g fill="none">
    <!-- R → C : claim -->
    <path stroke="#22d3ee" stroke-width="1.5" d="M 240 135 L 320 135" marker-end="url(#ah-cyan)"/>
    <!-- C → A : flagged -->
    <path stroke="#ff7b72" stroke-width="1.5" d="M 540 135 L 720 135" marker-end="url(#ah-warn)"/>
    <!-- A → OK : verdict -->
    <path stroke="#7ee787" stroke-width="1.5" d="M 940 135 L 1020 135" marker-end="url(#ah-green)"/>
  </g>

  <!-- arrow labels (centered in gaps, sized to fit) -->
  <g font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" text-anchor="middle">
    <g transform="translate(280 122)">
      <rect x="-30" y="-9" width="60" height="16" rx="3" fill="#0d1117" stroke="#22d3ee" stroke-width="0.75"/>
      <text y="3" fill="#22d3ee">CLAIM</text>
    </g>
    <g transform="translate(630 122)">
      <rect x="-76" y="-9" width="152" height="16" rx="3" fill="#0d1117" stroke="#ff7b72" stroke-width="0.75"/>
      <text y="3" fill="#ff7b72">FLAGGED · WEAK CITE</text>
    </g>
    <g transform="translate(980 122)">
      <rect x="-30" y="-9" width="60" height="16" rx="3" fill="#0d1117" stroke="#7ee787" stroke-width="0.75"/>
      <text y="3" fill="#7ee787">RULES</text>
    </g>
  </g>

  <!-- ─── A → R : revise on reject (dashed return curve under) ─── -->
  <path stroke="#f5a524" stroke-width="1.2" stroke-dasharray="4 4" fill="none"
        d="M 830 190 C 830 280, 130 280, 130 190" marker-end="url(#ah-mute)"/>
  <g transform="translate(480 286)" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" text-anchor="middle">
    <rect x="-94" y="-9" width="186" height="16" rx="3" fill="#0d1117" stroke="#f5a524" stroke-width="0.75"/>
    <text y="3" fill="#f5a524">REVISE ON REJECT · RETRY</text>
  </g>

  <!-- ─── INVARIANT BLOCK ─── -->
  <g transform="translate(20 340)">
    <line x1="0" y1="0" x2="1240" y2="0" stroke="#7d8590" stroke-opacity="0.18"/>
    <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1">▸ INVARIANT</text>
    <text x="0" y="44" font-size="13" fill="#e6edf3">Different RLHF training produces different blind spots —</text>
    <text x="0" y="62" font-size="13" fill="#b1bac4">three roles must come from <tspan font-family="JetBrains Mono, monospace" fill="#f5a524">different model families</tspan> for the critique to triangulate, not echo.</text>
  </g>
</svg>
