<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" font-family="Geist, system-ui, sans-serif" font-size="13" fill="none">
  <!-- PALETTE: panel #0d1117 · ink · soft · mute · amber · cyan · green · warn
       LAYOUT — Phase N feeds a HITL gate. If gated, an Operator reviews and
                approves or aborts. Approve → Phase N+1. Both decisions emit
                events to the audit log. -->
  <defs>
    <marker id="ah-mute"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8590"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5a524"/></marker>
    <marker id="ah-cyan"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#22d3ee"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker>
    <marker id="ah-warn"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff7b72"/></marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- P1 · Phase N -->
  <g transform="translate(20 200)" filter="url(#node-shadow)">
    <rect width="200" height="100" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">PHASE · N</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Research · Plan</text>
    <text x="14" y="74" font-size="11" fill="#b1bac4">artifacts ready for review</text>
  </g>

  <!-- G · HITL gate (diamond, amber) -->
  <g transform="translate(260 180)" filter="url(#node-shadow)">
    <polygon points="120,0 240,70 120,140 0,70" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="120" y="50" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" text-anchor="middle" letter-spacing="1.6">HITL GATE</text>
    <text x="120" y="74" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">phase transition?</text>
    <text x="120" y="94" font-size="11" fill="#b1bac4" text-anchor="middle">configurable per-phase</text>
  </g>

  <!-- H · Operator review (cyan, top branch) -->
  <g transform="translate(540 60)" filter="url(#node-shadow)">
    <rect width="240" height="100" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">OPERATOR REVIEW</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Human inspects</text>
    <text x="14" y="72" font-size="11" fill="#b1bac4">artifacts · plan diff · cost est.</text>
  </g>

  <!-- A · Approve (green) -->
  <g transform="translate(820 30)" filter="url(#node-shadow)">
    <rect width="200" height="80" rx="40" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
    <text x="100" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" text-anchor="middle" letter-spacing="1.6">✓ APPROVE</text>
    <text x="100" y="52" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">continue</text>
  </g>

  <!-- X · Abort (warn) -->
  <g transform="translate(820 130)" filter="url(#node-shadow)">
    <rect width="200" height="80" rx="40" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="100" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" text-anchor="middle" letter-spacing="1.6">✗ ABORT</text>
    <text x="100" y="52" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">stop run</text>
  </g>

  <!-- P2 · Phase N+1 -->
  <g transform="translate(1060 60)" filter="url(#node-shadow)">
    <rect width="200" height="100" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">PHASE · N+1</text>
    <text x="14" y="50" font-size="16" font-weight="600" fill="#e6edf3">Synthesise</text>
    <text x="14" y="74" font-size="11" fill="#b1bac4">irreversible writes resume</text>
  </g>

  <!-- AUD · Audit log (bottom-right) -->
  <g transform="translate(1060 360)" filter="url(#node-shadow)">
    <rect width="200" height="100" rx="6" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" letter-spacing="1.6">EVIDENCE</text>
    <text x="14" y="48" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#e6edf3">audit_trail.jsonl</text>
    <text x="14" y="72" font-size="11" fill="#b1bac4">hitl_approved · hitl_aborted</text>
  </g>

  <!-- ─── ARROWS ─── -->
  <!-- P1 → G -->
  <path stroke="#7d8590" stroke-width="1.4" fill="none" d="M 220 250 L 260 250" marker-end="url(#ah-mute)"/>

  <!-- G → H (gated, amber, up) -->
  <path stroke="#f5a524" stroke-width="1.5" fill="none" d="M 440 220 C 490 220, 490 110, 540 110" marker-end="url(#ah-amber)"/>

  <!-- G → P2 (ungated, gray straight) -->
  <path stroke="#7d8590" stroke-width="1.4" stroke-dasharray="4 3" fill="none" d="M 500 250 C 700 250, 900 220, 1060 130" marker-end="url(#ah-mute)"/>

  <!-- H → A -->
  <path stroke="#22d3ee" stroke-width="1.4" fill="none" d="M 780 90 L 820 70" marker-end="url(#ah-green)"/>
  <!-- H → X -->
  <path stroke="#22d3ee" stroke-width="1.4" fill="none" d="M 780 130 L 820 170" marker-end="url(#ah-warn)"/>

  <!-- A → P2 -->
  <path stroke="#7ee787" stroke-width="1.4" fill="none" d="M 1020 70 C 1040 70, 1050 90, 1060 90" marker-end="url(#ah-mute)"/>

  <!-- A → AUD (event, dotted) -->
  <path stroke="#7ee787" stroke-width="1.1" stroke-dasharray="3 3" fill="none" d="M 920 110 C 920 250, 1140 250, 1140 360" marker-end="url(#ah-mute)"/>
  <!-- X → AUD (event, dotted) -->
  <path stroke="#ff7b72" stroke-width="1.1" stroke-dasharray="3 3" fill="none" d="M 920 210 C 920 280, 1100 280, 1100 360" marker-end="url(#ah-mute)"/>

  <!-- decision pills -->
  <g font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" text-anchor="middle">
    <g transform="translate(490 162)">
      <rect x="-30" y="-9" width="60" height="16" rx="3" fill="#0d1117" stroke="#f5a524" stroke-width="0.75"/>
      <text y="3" fill="#f5a524">GATED</text>
    </g>
    <g transform="translate(700 220)">
      <rect x="-38" y="-9" width="76" height="16" rx="3" fill="#0d1117" stroke="#7d8590" stroke-width="0.75"/>
      <text y="3" fill="#b1bac4">UNGATED</text>
    </g>
    <g transform="translate(1010 290)">
      <rect x="-26" y="-9" width="52" height="16" rx="3" fill="#0d1117" stroke="#7d8590" stroke-width="0.75"/>
      <text y="3" fill="#b1bac4">EVENT</text>
    </g>
  </g>

  <!-- ─── INVARIANT FOOTER ─── -->
  <g transform="translate(20 490)" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
    <line x1="0" y1="0" x2="1240" y2="0" stroke="#7d8590" stroke-opacity="0.18"/>
    <text x="0" y="20">▸ INVARIANT — both APPROVE and ABORT carry operator identity into the audit log; "they had permission" is forensically reconstructable</text>
  </g>
</svg>
