<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" font-family="Geist, system-ui, sans-serif" font-size="13" fill="none">
  <!-- PALETTE: panel #0d1117 · ink #e6edf3 · soft #b1bac4 · mute #7d8590 · amber #f5a524 · cyan #22d3ee · green #7ee787 · warn #ff7b72 -->

  <defs>
    <marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7d8590"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5a524"/></marker>
    <marker id="ah-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#22d3ee"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker>
    <marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff7b72"/></marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ─── MAIN FLOW (top row): A → B → C → D → E ─── -->
  <g transform="translate(40 60)" filter="url(#node-shadow)">
    <rect width="180" height="92" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">STEP · 1</text>
    <text x="14" y="48" font-size="16" font-weight="600" fill="#e6edf3">Hypothesise</text>
    <text x="14" y="74" font-size="11" fill="#b1bac4">highest knowledge gap</text>
  </g>

  <g transform="translate(245 60)" filter="url(#node-shadow)">
    <rect width="180" height="92" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">STEP · 2</text>
    <text x="14" y="48" font-size="16" font-weight="600" fill="#e6edf3">Execute</text>
    <text x="14" y="74" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">web · docs · code</text>
  </g>

  <g transform="translate(450 60)" filter="url(#node-shadow)">
    <rect width="200" height="92" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">STEP · 3</text>
    <text x="14" y="48" font-size="16" font-weight="600" fill="#e6edf3">Critique</text>
    <text x="14" y="74" font-size="11" fill="#b1bac4">different backend · different priors</text>
  </g>

  <g transform="translate(675 60)" filter="url(#node-shadow)">
    <rect width="200" height="92" rx="6" fill="#0d1117" stroke="#7d8590" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1.6">STEP · 4</text>
    <text x="14" y="48" font-size="16" font-weight="600" fill="#e6edf3">Score</text>
    <text x="14" y="74" font-family="JetBrains Mono, monospace" font-size="11" fill="#b1bac4">heuristic 40% + judge 60%</text>
  </g>

  <!-- E · Decide (diamond, amber) -->
  <g transform="translate(900 60)" filter="url(#node-shadow)">
    <polygon points="100,0 200,46 100,92 0,46" fill="#0d1117" stroke="#f5a524" stroke-width="1.5"/>
    <text x="100" y="34" font-family="JetBrains Mono, monospace" font-size="10" fill="#f5a524" text-anchor="middle" letter-spacing="1.6">STEP · 5</text>
    <text x="100" y="54" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Decide</text>
    <text x="100" y="72" font-size="11" fill="#b1bac4" text-anchor="middle">improved?</text>
  </g>

  <!-- ─── BRANCH ROW (bottom): G  ←  F  +  STOP ─── -->
  <g transform="translate(900 270)" filter="url(#node-shadow)">
    <rect width="200" height="80" rx="6" fill="#0d1117" stroke="#7ee787" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" letter-spacing="1.6">✓ KEEP</text>
    <text x="14" y="46" font-size="16" font-weight="600" fill="#e6edf3">Grow corpus</text>
    <text x="14" y="66" font-size="11" fill="#b1bac4">claim survives review</text>
  </g>

  <g transform="translate(670 270)" filter="url(#node-shadow)">
    <rect width="200" height="80" rx="6" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#22d3ee" letter-spacing="1.6">STEP · 6</text>
    <text x="14" y="46" font-size="16" font-weight="600" fill="#e6edf3">Compress</text>
    <text x="14" y="66" font-size="11" fill="#b1bac4">distill · drop noise</text>
  </g>

  <g transform="translate(1145 270)" filter="url(#node-shadow)">
    <rect width="130" height="80" rx="6" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" letter-spacing="1.6">HALT</text>
    <text x="14" y="46" font-size="16" font-weight="600" fill="#e6edf3">Stop</text>
    <text x="14" y="66" font-family="JetBrains Mono, monospace" font-size="10" fill="#b1bac4">budget hit</text>
  </g>

  <!-- ─── FORWARD ARROWS (gray) ─── -->
  <g stroke="#7d8590" stroke-width="1.2" fill="none">
    <path d="M 220 106 L 245 106" marker-end="url(#ah-mute)"/>
    <path d="M 425 106 L 450 106" marker-end="url(#ah-mute)"/>
    <path d="M 650 106 L 675 106" marker-end="url(#ah-mute)"/>
    <path d="M 875 106 L 900 106" marker-end="url(#ah-mute)"/>
  </g>

  <!-- KEEP: E (bottom of diamond) → G (top) -->
  <path stroke="#7ee787" stroke-width="1.5" fill="none" d="M 1000 152 L 1000 270" marker-end="url(#ah-green)"/>
  <g transform="translate(1015 215)">
    <rect x="0" y="-9" width="40" height="16" rx="3" fill="#0d1117" stroke="#7ee787" stroke-width="0.75"/>
    <text x="20" y="3" font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" text-anchor="middle" letter-spacing="1.4">YES</text>
  </g>

  <!-- G → F (left arrow) -->
  <path stroke="#7d8590" stroke-width="1.2" fill="none" d="M 900 310 L 870 310" marker-end="url(#ah-mute)"/>

  <!-- F → A (loop back, big curve up-left) -->
  <path stroke="#7d8590" stroke-width="1.2" fill="none"
        d="M 670 310 C 400 310, 130 290, 130 152" marker-end="url(#ah-mute)"/>
  <g transform="translate(380 318)">
    <rect x="-58" y="-9" width="116" height="16" rx="3" fill="#0d1117" stroke="#7d8590" stroke-width="0.75"/>
    <text x="0" y="3" font-family="JetBrains Mono, monospace" font-size="10" fill="#b1bac4" text-anchor="middle" letter-spacing="1.4">NEXT ITERATION</text>
  </g>

  <!-- DISCARD: E → A (warn red, dashed, big arc below) -->
  <path stroke="#ff7b72" stroke-width="1.2" stroke-dasharray="4 4" fill="none"
        d="M 970 152 C 970 200, 970 430, 130 430 C 60 430, 70 200, 130 152" marker-end="url(#ah-warn)"/>
  <g transform="translate(540 442)">
    <rect x="-50" y="-9" width="100" height="16" rx="3" fill="#0d1117" stroke="#ff7b72" stroke-width="0.75"/>
    <text x="0" y="3" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff7b72" text-anchor="middle" letter-spacing="1.4">NO · DISCARD</text>
  </g>

  <!-- G → STOP (max_iterations, dotted warn). No pill in the gap —
       too narrow; the STOP node's "HALT · budget hit" copy already
       conveys the meaning. -->
  <path stroke="#ff7b72" stroke-width="1" stroke-dasharray="2 3" fill="none" d="M 1100 310 L 1145 310" marker-end="url(#ah-warn)"/>

  <!-- ─── INVARIANT FOOTER ─── -->
  <g transform="translate(40 510)" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
    <line x1="0" y1="0" x2="1240" y2="0" stroke="#7d8590" stroke-opacity="0.18"/>
    <text x="0" y="20">▸ STOPPING — Ctrl+C · max_iterations · target_dimensions_total · whichever fires first</text>
  </g>
</svg>
