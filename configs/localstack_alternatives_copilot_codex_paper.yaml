research:
  topic: 'Compare alternatives to LocalStack for local AWS service emulation, given
    that LocalStack is moving to a fully paid/subscription model for commercial use.
    Evaluate nahuelnucera/ministack, hectorvent/floci, and any other viable open-source
    alternatives. Focus on practical usability for development and CI/CD pipelines.

    '
  goal: 'A decision-ready comparison report for a team currently using LocalStack
    that needs to evaluate whether to pay for LocalStack Pro or migrate to an open-source
    alternative. Include migration effort estimates, service coverage gaps, and a
    clear recommendation.

    '
  dimensions:
  - AWS service coverage (S3, SQS, SNS, Lambda, DynamoDB, API Gateway, IAM, CloudFormation)
  - Licensing and pricing (LocalStack free vs Pro vs alternatives)
  - Docker image size, startup time, and resource usage
  - CI/CD integration (GitHub Actions, GitLab CI, Jenkins)
  - API compatibility and fidelity vs real AWS
  - Community activity, maintenance status, and bus factor
  - Migration effort from LocalStack (config, SDK compatibility, breaking changes)
  - Terraform / CDK / SAM / CloudFormation support
  scoring:
    min_dimensions_per_iteration: 1
    target_dimensions_total: 8
    evidence_types:
    - comparison_table
    - pricing_data
    - code_example
    - trade_off_analysis
  execution:
    max_iterations: 10
    compress_every: 4
    allowed_tools: WebSearch,WebFetch,Read,Bash,Glob,Grep
    max_turns: 8
    backend: claude-cli
    model: sonnet
    max_budget_per_call: 2.0
    timeout_seconds: 600
    strategy: adversarial
    providers:
      primary_reasoner:
        adapter: claude-cli
        model: sonnet
      research_coder:
        adapter: copilot-cli
        model: claude-sonnet-4.6
      adversary_reasoner:
        adapter: codex-cli
        model: gpt-5.4
    backends:
      primary: primary_reasoner
      research:
      - research_coder
      - adversary_reasoner
      judge: adversary_reasoner
      utility: adversary_reasoner
    strategy_config:
      critique_depth: thorough
  reporting:
    output_style: paper
    export_html: true
    export_pdf: false
    style_overrides:
      citation_mode: references_section
      include_methodology: true
      include_limitations: true
