# AutoResearch configuration template.
# Copy this file and fill in your research topic.

research:
  topic: "Your research question here"
  goal: >
    What the final output should look like and who it is for.

  dimensions:
    - "First dimension to explore"
    - "Second dimension to explore"
    # Add as many as needed. The agent will also discover new ones.

  methodology:
    question: ""              # Optional explicit framing question
    scope: ""                 # Optional scope / intended audience / boundaries
    inclusion_criteria: []    # Optional preferred evidence/source criteria
    exclusion_criteria: []    # Optional evidence/source types to avoid
    preferred_source_types: []  # Optional ordered preferences (e.g. official docs, standards)
    recency_days: 0           # Optional freshness target for unstable facts
    # Tip: combine this with prompts that require source URLs and confidence
    # labels so the run can produce stronger claims.json / citations.json output.

  evaluation:
    benchmark_id: ""          # Optional benchmark/task identifier (autoloads benchmark_catalog/<id>.yaml if present)
    run_baselines: false      # Generate a single-pass baseline.md + evaluation.json
    expected_dimensions: []   # Optional benchmark coverage expectations; overrides bundled benchmark dimensions
    required_keywords: []     # Optional keywords expected in the final output; overrides bundled benchmark keywords
    reference_runs: []        # Optional prior output dirs for consistency / cross-strategy comparison
    semantic_calibration: true # Generate semantic_calibration.json and include it in evaluation/reporting
    semantic_review: false     # Optional final judge pass over synthesis; writes semantic_review.json

    # --- Multi-judge consensus (optional) -----------------------------
    # When two or more judges are listed, each iteration's quality
    # score is a weighted average across judges. Per-judge breakdowns
    # appear in dashboard.json. Disagreements above
    # ``judge_disagreement_threshold`` (1-10 axis points) emit an
    # audit event. Default (no judges listed) preserves single-judge
    # behavior using the strategy's primary judge backend.
    # judges:
    #   - adapter: gemini-cli
    #     model: gemini-2.5-flash
    #     weight: 1.0
    #   - adapter: codex-cli
    #     model: gpt-5.4
    #     weight: 1.0
    # judge_disagreement_threshold: 2

  reporting:
    export_html: true         # Generate report.html from final run artifacts
    export_pdf: false         # Generate report.pdf from final run artifacts
    report_title: ""          # Optional custom title for the HTML report
    output_style: default     # Run-mode synthesis prose profile: default | paper | technical_doc | executive_brief | decision_memo
    style_overrides:
      include_executive_summary: null  # Optional: true | false | null
      include_comparison_table: null   # Optional: true | false | null
      include_methodology: null        # Optional: true | false | null
      include_limitations: null        # Optional: true | false | null
      include_next_actions: null       # Optional: true | false | null
      section_order: ""               # Optional: "" | standard | recommendation_first | evidence_first
      recommendation_mode: ""         # Optional: "" | ranked | decision_only
      citation_mode: ""               # Optional: "" | inline_links | references_section
    capture_raw_backend_outputs: false # Reserved opt-in switch for future raw backend payload capture
    raw_backend_output_max_chars: 20000 # Planned size cap if raw payload capture is implemented later
    raw_backend_output_redact: true    # Planned redaction toggle if raw payload capture is implemented later

  scoring:
    min_dimensions_per_iteration: 1
    target_dimensions_total: 10   # stop after this many dimensions have been explored
    evidence_types:               # DEPRECATED: kept for backward compat;
      - comparison_table          # the universal-signal heuristic ignores
      - pricing_data              # this list. Universal signals (citations,
      - code_example              # concrete data, structure) work for any
      - architecture_diagram_description # dimension type without per-dim config.
      - trade_off_analysis

    # --- Composite scoring weights (optional) -------------------------
    # Defaults preserve the legacy 0.4 coverage + 0.6 quality formula by
    # setting ``novelty_weight: 0`` and ``depth_bonus: 0``. Operators
    # opt into the novelty-blended formula and re-attempt depth bonus
    # by setting these positive.
    #
    # When novelty_weight > 0:
    #   quality_blend = (1 - judge_novelty_share) * quality
    #                   + judge_novelty_share * (judge_novelty_axis * 10)
    #   total = coverage_weight * coverage
    #         + quality_weight * quality_blend
    #         + novelty_weight * heuristic_novelty
    #
    # When depth_bonus > 0 and a dimension has been attempted >= 2 times:
    #   prev_best is scaled DOWN by 1 + depth_bonus * min(attempts-1, 3)
    #   so a focused refinement can clear the KEEP gate without having
    #   to beat the original broad-pass score outright.
    # weights:
    #   coverage_weight: 0.4
    #   quality_weight: 0.6
    #   novelty_weight: 0.0       # Suggested calibrated value: 0.25
    #   judge_novelty_share: 0.3
    #   depth_bonus: 0.0          # Suggested calibrated value: 0.15

  # --- Discovery: gap intake filtering + promotion (optional) ---------
  # Defaults match pre-Phase-3 behavior: every gap that survives intake
  # is auto-promoted on first sight. Operators opt into convergence-
  # gated promotion via ``promotion_enabled: true``.
  #
  # Intake filters (always on):
  # - language_filter: drops Spanish-style code-switch gaps
  # - dedupe_threshold: Levenshtein-style similarity above which two
  #   gap topics are considered duplicates
  # - length: 30-200 chars enforced by JUDGE_SCHEMA
  #
  # Promotion (opt-in):
  # - promotion_enabled: gate hypothesis-pool entry on convergence
  # - promotion_min_occurrences: repeated sightings count as
  #   convergence
  # - promotion_high_confidence: single sighting promoted if mean
  #   judge confidence >= this threshold (1-10)
  # discovery:
  #   language_filter: en           # en | none
  #   dedupe_threshold: 0.85        # 0.0-1.0
  #   promotion_enabled: false      # opt in once you have multi-iter runs
  #   promotion_min_occurrences: 2
  #   promotion_high_confidence: 8

  execution:
    max_iterations: 0       # 0 = no iteration cap; target_dimensions_total can still stop the run
    compress_every: 5       # compress knowledge base every N iterations
    system_prompt: ""       # Optional shared system/developer instruction for supported backends
    stream: false           # Live stream research-phase output when the chosen backend supports it
    allowed_tools: "WebSearch,WebFetch,Read,Bash,Glob,Grep"
    max_turns: 10           # max agent turns per research call
    timeout_seconds: 600    # timeout per invocation
    backend_preflight: true # Run a cheap live "respond OK" probe for CLI backends before non-dry runs
    backend_preflight_timeout_seconds: 60 # timeout per backend preflight probe

    backend: claude-cli         # "claude-cli", "codex-cli", "gemini-cli", "copilot-cli", "claude-api", "codex-api", "gemini-api", "litellm-api", "copilot-api", or "bedrock-api"
    model: sonnet           # model name (backend-specific, see below)
    lightweight_mode: false # Prefer shorter prompts/artifacts and stricter short-goal obedience
    isolate_backend_context: true # Run backend CLIs from a neutral temp dir to avoid repo/skill/MCP leakage
    sanitize_backend_env: true    # Pass a reduced subprocess environment (PATH, HOME, API keys, ...)

    # ---------------------------------------------------------------
    # Multi-backend strategies (optional — omit for single-backend)
    # ---------------------------------------------------------------
    # strategy: ensemble     # single | ensemble | adversarial | parallel | serial | specialist
    # providers:
    #   primary_reasoner:
    #     adapter: claude-cli
    #     model: sonnet
    #   research_coder:
    #     adapter: codex-cli
    #     model: gpt-5.4
    #   utility_fast:
    #     adapter: gemini-cli
    #     model: gemini-2.5-flash
    #   gateway_fast:
    #     adapter: litellm-api
    #     model: openai/gpt-4.1-mini
    #     base_url: http://localhost:4000
    #   github_models:
    #     adapter: copilot-api
    #     model: openai/gpt-4.1
    #     organization: acme
    #     api_version: 2026-03-10
    #   aws_foundation:
    #     adapter: bedrock-api
    #     model: anthropic.claude-3-5-sonnet-20240620-v1:0
    #     region: us-east-1
    #     aws_profile: sandbox
    # backends:
    #   primary: primary_reasoner
    #   research:
    #     - primary_reasoner
    #     - research_coder
    #   judge: primary_reasoner
    #   utility: gateway_fast
    # strategy_config:
    #   merge_mode: best     # best (pick highest score) | union (merge all passing)
    #   merge_threshold: 40.0
    #   stagger_seconds: 5   # delay between parallel backend launches
    #   critique_depth: standard  # light | standard | thorough (adversarial only)
    #   refiner_sees_draft: true  # serial only

    # ---------------------------------------------------------------
    # Available models per backend (verified April 2026)
    # ---------------------------------------------------------------
    #
    # claude-cli (Anthropic Claude Code CLI) — recommended for single-backend:
    #   Top:         opus          (claude-opus-4.6)
    #   Recommended: sonnet        (claude-sonnet-4.6) <-- default
    #   Budget:      haiku         (claude-haiku-4.5)
    #   Features:    JSON schema, budget cap, rate limit detection, result salvage
    #
    # codex-cli (OpenAI Codex CLI):
    #   Default:     gpt-5.4       (set in ~/.codex/config.toml)
    #   Note:        Set features.remote_models = true in config.toml
    #                Model availability varies by account type (ChatGPT vs API)
    #   Operational: strong results, but can consume a lot of tokens even on
    #                small smoke tests; prefer Claude when you want the cheapest
    #                sanity-check runs
    #
    # gemini-cli (Google Gemini CLI):
    #   Default:     gemini-2.5-flash
    #   Alternative: gemini-2.5-pro
    #   Caveat:      Free tier has aggressive rate limits — CLI retries
    #                internally, consuming the timeout budget
    #
    # copilot-cli (GitHub Copilot CLI):
    #   Default:     gpt-4.1
    #   Install:     npm install -g @github/copilot
    #   Caveat:      Coding agent — cannot reliably return structured JSON.
    #                Use only as research backend in multi-backend strategies.
    # ---------------------------------------------------------------
