# Smoke test for ensemble strategy.
# Claude + codex-cli research independently, claude-cli judges blindly.
# Codex never touches hypothesis/judge — different provider for blind review.

research:
  topic: "What are three pros and cons of Python?"
  goal: "A bullet-point list in under 100 words"

  dimensions:
    - "Developer experience"

  scoring:
    min_dimensions_per_iteration: 1
    target_dimensions_total: 1
    evidence_types:
      - trade_off_analysis

  execution:
    max_iterations: 1
    compress_every: 99
    allowed_tools: ""
    max_turns: 2
    backend: claude-cli
    model: sonnet
    max_budget_per_call: 1.00
    timeout_seconds: 600
    backend_preflight: true # Live OK probe per CLI backend before the run
    backend_preflight_timeout_seconds: 60 # per probe
    lightweight_mode: true

    strategy: ensemble
    providers:
      primary_reasoner:
        adapter: claude-cli
        model: sonnet
      research_coder:
        adapter: codex-cli
        model: gpt-5.4
      research_reasoner:
        adapter: claude-cli
        model: sonnet
    backends:
      primary: primary_reasoner   # hypothesis + synthesis
      research:
        - research_coder         # researcher 1 (different provider)
        - research_reasoner      # researcher 2
      judge: research_coder      # blind review (didn't do hypothesis)
      utility: research_coder
    strategy_config:
      merge_mode: best
      stagger_seconds: 5
