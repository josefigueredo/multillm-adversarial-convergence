# Smoke test for Codex backend.

research:
  topic: "What are three pros and cons of Python?"
  goal: "A bullet-point list in under 100 words"

  dimensions:
    - "Developer experience"

  scoring:
    min_dimensions_per_iteration: 1
    target_dimensions_total: 1
    evidence_types:
      - trade_off_analysis

  execution:
    max_iterations: 1
    compress_every: 99
    allowed_tools: ""
    max_turns: 2
    backend: codex-cli
    model: gpt-5.4
    max_budget_per_call: 1.00
    timeout_seconds: 300
    backend_preflight: true # Live OK probe per CLI backend before the run
    backend_preflight_timeout_seconds: 60 # per probe
    lightweight_mode: true
