# Smoke test for specialist strategy.
# Routes dimensions by keyword: codex-cli for code, claude-cli for reasoning.

research:
  topic: "What are three pros and cons of Python?"
  goal: "A bullet-point list in under 100 words"

  dimensions:
    - "Developer experience"

  scoring:
    min_dimensions_per_iteration: 1
    target_dimensions_total: 1
    evidence_types:
      - trade_off_analysis

  execution:
    max_iterations: 1
    compress_every: 99
    allowed_tools: ""
    max_turns: 2
    backend: claude-cli
    model: sonnet
    max_budget_per_call: 1.00
    timeout_seconds: 300
    lightweight_mode: true

    strategy: specialist
    providers:
      primary_reasoner:
        adapter: claude-cli
        model: sonnet
      reasoning_main:
        adapter: claude-cli
        model: sonnet
      coding_fast:
        adapter: codex-cli
        model: gpt-5.4
    backends:
      primary: primary_reasoner   # hypothesis + synthesis
      research:
        - reasoning_main         # reasoning, architecture, trade-offs
        - coding_fast           # code, implementation, API
      judge: coding_fast         # judge (different provider)
      utility: coding_fast
