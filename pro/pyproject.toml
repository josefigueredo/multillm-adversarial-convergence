[project]
name = "slides-template-pro"
version = "0.1.0"
description = "Synchronized slide playback with serverless Python backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Two roots so handlers/_aws.py can do `from shared import ...` (lambda
# runtime layout) AND tests/local server can do `from backend.shared ...`.
pythonpath = [".", "backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
