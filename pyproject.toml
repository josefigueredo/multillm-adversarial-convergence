[project]
name = "autoresearch"
version = "0.2.0"
description = "Autonomous research framework powered by AI coding agent CLIs"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
autoresearch = "src.cli:main"
